# Spring Boot Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Name
spring.application.name=smart-expense-backend

# Firebase Configuration
# Path to serviceAccountKey.json (place it in src/main/resources/ or provide path)
firebase.config.path=classpath:serviceAccountKey.json
firebase.project-id=smart-expense-app

# CORS Configuration (Allowed origins for React frontend)
cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Logging Levels
logging.level.com.smartexpense=DEBUG
logging.level.org.springframework.security=INFO
